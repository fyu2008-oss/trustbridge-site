name: Rename site file
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rename.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename file
        run: |
          if [ -f trustbridge-consulting.html ] && [ ! -f index.html ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git mv trustbridge-consulting.html index.html
            rm -f .github/workflows/rename.yml
            git add -A
            git commit -m "Rename trustbridge-consulting.html to index.html"
            git push
          fi
